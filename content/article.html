<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article | signsofchangeke</title>
  
  <!-- Marked.js: Converts Markdown text from Decap CMS into HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-color: #f7f6f0;
      --text-dark: #111111;
      --accent-teal: #108575;
      --badge-bg: #d4f0eb;
      --card-bg: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    /* Header Styling */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      background: #ffffff;
      border-bottom: 1px solid #e2e2e2;
    }

    .logo {
      font-weight: 800;
      font-size: 1.3rem;
      text-decoration: none;
      color: #000000;
    }

    /* Breadcrumbs Navigation Trail */
    .breadcrumbs {
      max-width: 800px;
      margin: 2rem auto 0;
      padding: 0 1.5rem;
      font-size: 0.9rem;
      color: #666666;
    }

    .breadcrumbs a {
      color: var(--accent-teal);
      text-decoration: none;
      font-weight: 600;
    }

    .breadcrumbs a:hover {
      text-decoration: underline;
    }

    .breadcrumbs .separator {
      margin: 0 0.5rem;
      color: #999999;
    }

    .breadcrumbs .current {
      color: #333333;
      font-weight: 600;
    }

    /* Main Article Container */
    .article-container {
      max-width: 800px;
      margin: 2rem auto 4rem;
      padding: 0 1.5rem;
    }

    .badge {
      display: inline-block;
      background-color: var(--badge-bg);
      color: var(--accent-teal);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .article-title {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.2;
      margin: 0 0 1rem 0;
    }

    .meta-info {
      font-size: 0.9rem;
      color: #555555;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .cover-image {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 2.5rem;
    }

    /* Article Body Typography */
    .article-body {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #222222;
    }

    .article-body p {
      margin-bottom: 1.5rem;
    }

    .article-body h2 {
      font-size: 1.75rem;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
    }

    .article-body blockquote {
      border-left: 4px solid var(--accent-teal);
      margin: 1.5rem 0;
      padding-left: 1rem;
      font-style: italic;
      color: #444444;
    }

    .back-btn {
      display: inline-block;
      margin-top: 3rem;
      padding: 0.75rem 1.5rem;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .back-btn:hover {
      background: #333333;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <a href="index.html" class="logo">Signsofchangeke</a>
  </header>

  <!-- Dynamic Breadcrumbs Trail -->
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a href="index.html">Home</a>
    <span class="separator">›</span>
    <a href="archive.html">Articles</a>
    <span class="separator">›</span>
    <span id="breadcrumb-title" class="current">Loading...</span>
  </nav>

  <!-- Article View -->
  <main class="article-container">
    <div id="category-badge" class="badge">Category</div>
    <h1 id="article-title" class="article-title">Loading Article...</h1>
    
    <div class="meta-info">
      <span>By <strong id="article-author">Admin</strong></span>
      <span>•</span>
      <span id="article-date">Date</span>
      <span>•</span>
      <span id="article-read-time">7 min read</span>
    </div>

    <img id="cover-image" class="cover-image" src="" alt="Article Banner" style="display: none;" />

    <div id="article-body" class="article-body">
      <p>Fetching content...</p>
    </div>

    <a href="index.html" class="back-btn">← Back to Homepage</a>
  </main>

  <script>
    // Helper function to extract YAML Frontmatter data from Decap CMS markdown files
    function parseFrontmatter(text) {
      const frontmatterRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
      const match = text.match(frontmatterRegex);

      if (!match) {
        return { data: {}, body: text };
      }

      const yamlBlock = match[1];
      const body = match[2];
      const data = {};

      yamlBlock.split('\n').forEach(line => {
        const [key, ...valueParts] = line.split(':');
        if (key && valueParts.length > 0) {
          let value = valueParts.join(':').trim();
          value = value.replace(/^["']|["']$/g, ''); // Clean quotes
          data[key.trim()] = value;
        }
      });

      return { data, body };
    }

    // Main article fetching function
    async function fetchAndRenderArticle() {
      // Get 'slug' from URL parameter (e.g. ?slug=2026-07-05-my-article)
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');

      if (!slug) {
        document.getElementById('article-title').innerText = "Article Not Found";
        document.getElementById('article-body').innerHTML = "<p>No article specified in URL.</p>";
        return;
      }

      try {
        // Fetch raw markdown file generated by Decap CMS
        const response = await fetch(`/content/posts/${slug}.md`);
        if (!response.ok) throw new Error("Article file missing");

        const rawText = await response.text();
        const { data, body } = parseFrontmatter(rawText);

        // Update Page Titles and Breadcrumb Trail
        document.title = `${data.title || 'Article'} | Hands & Voices`;
        document.getElementById('article-title').innerText = data.title || "Untitled";
        document.getElementById('breadcrumb-title').innerText = data.title || "Article";

        // Update Metadata Elements
        document.getElementById('category-badge').innerText = data.category || "General";
        document.getElementById('article-author').innerText = data.author || "Hands & Voices";

        if (data.date) {
          const formattedDate = new Date(data.date).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          });
          document.getElementById('article-date').innerText = formattedDate;
        }

        if (data.read_time) {
          document.getElementById('article-read-time').innerText = data.read_time;
        }

        // Cover Image
        if (data.image) {
          const imgEl = document.getElementById('cover-image');
          imgEl.src = data.image;
          imgEl.style.display = 'block';
        }

        // Render Markdown body into formatted HTML
        document.getElementById('article-body').innerHTML = marked.parse(body);

      } catch (error) {
        console.error(error);
        document.getElementById('article-title').innerText = "Article Not Found";
        document.getElementById('article-body').innerHTML = "<p>Sorry, this post couldn't be loaded.</p>";
      }
    }

    // Run when page loads
    fetchAndRenderArticle();
  </script>
</body>
</html>
